<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Absen — SMP Sains Lombok Islamic School</title>
<link rel="icon" href="data:,">
<style>
@import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f5f4f0;--surface:#fff;--border:#e2e0d8;
  --text:#1a1917;--muted:#6b6963;--hint:#c0bdb6;
  --green:#1d7a4a;--green-bg:#e3f5ec;--green-bdr:#9fdfc0;
  --red:#a3201e;--red-bg:#fce8e8;--red-bdr:#f4a9a8;
  --amber:#8a5a00;--amber-bg:#fdf0d5;--amber-bdr:#f0c97a;
  --blue:#1a5fb4;--blue-bg:#e8f0fc;
  --gray:#f1f0eb;--r:10px;--rl:14px;
}
html.dark{
  --bg:#0f1117;--surface:#1a1d27;--border:#2a2d3e;
  --text:#f0f2ff;--muted:#7c82a8;--hint:#3a3f5c;
  --green:#3dd68c;--green-bg:rgba(61,214,140,.15);--green-bdr:rgba(61,214,140,.3);
  --red:#f75f5f;--red-bg:rgba(247,95,95,.15);--red-bdr:rgba(247,95,95,.3);
  --amber:#f5a623;--amber-bg:rgba(245,166,35,.15);--amber-bdr:rgba(245,166,35,.3);
  --blue:#4f8ef7;--blue-bg:rgba(79,142,247,.15);
  --gray:rgba(255,255,255,.05);
}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .2s,color .2s}
.layout{max-width:520px;margin:0 auto;padding:1.25rem 1rem}
.header{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1rem 1.25rem;margin-bottom:.875rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
.h-left h1{font-size:16px;font-weight:700}
.h-left p{font-size:12px;color:var(--muted);margin-top:2px}
.clock{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
.dbar{padding:9px 14px;border-radius:var(--r);font-size:13px;font-weight:600;margin-bottom:.875rem;border:1px solid transparent}
.db-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-bdr)}
.db-warn{background:var(--amber-bg);color:var(--amber);border-color:var(--amber-bdr)}
.db-alfa{background:var(--red-bg);color:var(--red);border-color:var(--red-bdr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rl);padding:1.125rem 1.25rem;margin-bottom:.875rem}
.card h3{font-size:14px;font-weight:700;margin-bottom:12px}
.btn{padding:8px 16px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;font-weight:600;cursor:pointer;background:var(--surface);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;transition:all .15s}
.btn:hover{background:var(--gray)}
.btn-dark{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-dark:hover{opacity:.85}
.inp{width:100%;padding:8px 11px;border:1px solid var(--border);border-radius:var(--r);font-size:13px;background:var(--surface);color:var(--text);font-family:'Plus Jakarta Sans',sans-serif;outline:none}
.inp:focus{border-color:var(--muted)}
.alert{padding:12px 16px;border-radius:var(--r);font-size:14px;font-weight:600;margin-bottom:12px;display:none;border:1px solid transparent;text-align:center}
.a-ok{background:var(--green-bg);color:var(--green);border-color:var(--green-bdr)}
.a-err{background:var(--red-bg);color:var(--red);border-color:var(--red-bdr)}
.a-info{background:var(--blue-bg);color:var(--blue);border-color:#a8c4f0}
.scanner-wrap{position:relative;width:100%;border-radius:var(--rl);overflow:hidden;border:2px solid var(--border);background:#000;margin-bottom:1rem;display:none}
#cam-video{width:100%;display:block;max-height:300px;object-fit:cover}
.scan-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.scan-frame{width:200px;height:200px;border:3px solid #fff;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);position:relative;overflow:hidden}
.scan-line{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#3dd68c,transparent);animation:sl 2s linear infinite;top:0}
@keyframes sl{0%{top:0}100%{top:100%}}
.log-list{display:flex;flex-direction:column;gap:7px;max-height:320px;overflow-y:auto}
.log-item{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;background:var(--gray);border-radius:var(--r);animation:fi .25s ease}
@keyframes fi{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.log-name{font-weight:600;font-size:13px}
.log-time{font-size:11px;color:var(--muted);margin-top:1px}
.badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:700}
.b-hadir{background:var(--green-bg);color:var(--green)}
.b-terlambat{background:var(--amber-bg);color:var(--amber)}
.b-alfa{background:var(--red-bg);color:var(--red)}
.b-pulang{background:var(--blue-bg);color:var(--blue)}
.cam-btns{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.counters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.875rem}
.cnt{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px;text-align:center}
.cnt-num{font-size:22px;font-weight:700}
.cnt-lbl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.c-g{color:var(--green)}.c-r{color:var(--red)}.c-b{color:var(--blue)}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.admin-link{text-align:center;font-size:12px;color:var(--muted);margin-top:1rem}
.admin-link a{color:var(--text);font-weight:600;text-decoration:none}
.flash-ok{animation:fok .5s ease}
.flash-err{animation:ferr .5s ease}
@keyframes fok{0%,100%{background:var(--bg)}50%{background:#b8f5d8}}
@keyframes ferr{0%,100%{background:var(--bg)}50%{background:#ffd5d5}}
html.dark .flash-ok{animation:fok-d .5s ease}
html.dark .flash-err{animation:ferr-d .5s ease}
@keyframes fok-d{0%,100%{background:var(--bg)}50%{background:rgba(61,214,140,.2)}}
@keyframes ferr-d{0%,100%{background:var(--bg)}50%{background:rgba(247,95,95,.2)}}
</style>

<script>
const BATAS_H=7,BATAS_M=30;
const BOLOS_H=19,BOLOS_M=0;
const SEKOLAH_LAT=-8.5541,SEKOLAH_LNG=116.0739,RADIUS_M=500;
const HARI=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
const BULAN=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
function pad(n){return String(n).padStart(2,'0')}
function todayStr(){const n=new Date();return`${n.getFullYear()}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`}

window.toggleDark=function(){
  const d=document.documentElement.classList.toggle('dark');
  localStorage.setItem('dark',d?'1':'0');
  document.getElementById('dark-toggle').textContent=d?'☀️':'🌙';
};
if(localStorage.getItem('dark')==='1'){
  document.documentElement.classList.add('dark');
  document.getElementById('dark-toggle').textContent='☀️';
}

function updateClock(){
  const now=new Date();
  document.getElementById('jam').textContent=`${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
  document.getElementById('hari-tgl').textContent=`${HARI[now.getDay()]}, ${now.getDate()} ${BULAN[now.getMonth()]} ${now.getFullYear()}`;
  const tot=now.getHours()*60+now.getMinutes(),batas=BATAS_H*60+BATAS_M,sisa=batas-tot;
  const bar=document.getElementById('dbar');
  if(sisa>30){bar.className='dbar db-ok';bar.textContent=`Batas absen masuk: 07:30 — sisa ${sisa} menit`;}
  else if(sisa>0){bar.className='dbar db-warn';bar.textContent=`Peringatan! Sisa ${sisa} menit sebelum batas 07:30`;}
  else{bar.className='dbar db-alfa';bar.textContent=`Waktu absen masuk habis. Masih bisa absen pulang.`;}
}
setInterval(updateClock,1000);updateClock();
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, collection, addDoc, query, where, getDocs, onSnapshot, Timestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig={
  apiKey:"AIzaSyDlCnUvgyDT-oTfJJ-nxcPWkhpY_b6JeBw",
  authDomain:"absen-kelas8.firebaseapp.com",
  projectId:"absen-kelas8",
  storageBucket:"absen-kelas8.firebasestorage.app",
  messagingSenderId:"636560501063",
  appId:"1:636560501063:web:4384206e2a3cd94151c462"
};
const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

let kelasList=[],siswaList=[],absenHariIni={},selectedKelas='',absenMode='masuk';
// ── MODE & LOKASI ─────────────────────────────────────────────────────
window.setMode=function(m){
  absenMode=m;
  const btnM=document.getElementById('tab-masuk'),btnP=document.getElementById('tab-pulang');
  if(m==='masuk'){btnM.style.background='var(--text)';btnM.style.color='var(--bg)';btnP.style.background='var(--surface)';btnP.style.color='var(--muted)';}
  else{btnP.style.background='var(--text)';btnP.style.color='var(--bg)';btnM.style.background='var(--surface)';btnM.style.color='var(--muted)';}
};
let curLat=null,curLng=null;
function haversineM(la1,lo1,la2,lo2){const R=6371000,dLa=(la2-la1)*Math.PI/180,dLo=(lo2-lo1)*Math.PI/180,a=Math.sin(dLa/2)**2+Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLo/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));}
function startLoc(){
  if(!navigator.geolocation)return;
  navigator.geolocation.watchPosition(pos=>{
    curLat=pos.coords.latitude;curLng=pos.coords.longitude;
    const dist=Math.round(haversineM(curLat,curLng,SEKOLAH_LAT,SEKOLAH_LNG));
    const el=document.getElementById('loc-status');
    if(dist<=RADIUS_M){el.style.color='var(--green)';el.textContent='📍 Di area sekolah ('+dist+'m)';}
    else{el.style.color='var(--amber)';el.textContent='⚠ Di luar sekolah ('+dist+'m) — dicatat';}
  },()=>{document.getElementById('loc-status').textContent='📍 Lokasi tidak tersedia';},{enableHighAccuracy:true,maximumAge:30000});
}
function getLocNote(){
  if(curLat===null)return{lat:null,lng:null,jarak_meter:null,lokasi:'tidak_tersedia'};
  const dist=Math.round(haversineM(curLat,curLng,SEKOLAH_LAT,SEKOLAH_LNG));
  return{lat:parseFloat(curLat.toFixed(6)),lng:parseFloat(curLng.toFixed(6)),jarak_meter:dist,lokasi:dist<=RADIUS_M?'di_sekolah':'di_luar_sekolah'};
}

let camStream=null,scanInterval=null,unsubscribe=null;

// ── OFFLINE / IndexedDB ──────────────────────────────────────────────
const IDB_NAME='absen-offline',IDB_VER=1,IDB_STORE='pending';
let idb=null;
function openIDB(){
  return new Promise((res,rej)=>{
    const req=indexedDB.open(IDB_NAME,IDB_VER);
    req.onupgradeneeded=e=>{e.target.result.createObjectStore(IDB_STORE,{keyPath:'id',autoIncrement:true});};
    req.onsuccess=e=>{idb=e.target.result;res(idb);};
    req.onerror=()=>rej(req.error);
  });
}
async function idbSave(rec){
  await openIDB();
  return new Promise((res,rej)=>{
    const tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).add(rec).onsuccess=e=>res(e.target.result);
    tx.onerror=()=>rej(tx.error);
  });
}
async function idbGetAll(){
  await openIDB();
  return new Promise((res,rej)=>{
    const tx=idb.transaction(IDB_STORE,'readonly');
    const req=tx.objectStore(IDB_STORE).getAll();
    req.onsuccess=()=>res(req.result);
    req.onerror=()=>rej(req.error);
  });
}
async function idbDelete(id){
  await openIDB();
  return new Promise((res,rej)=>{
    const tx=idb.transaction(IDB_STORE,'readwrite');
    tx.objectStore(IDB_STORE).delete(id).onsuccess=()=>res();
    tx.onerror=()=>rej(tx.error);
  });
}
function updateOnlineBar(){
  let bar=document.getElementById('offline-bar');
  if(!bar){
    bar=document.createElement('div');bar.id='offline-bar';
    bar.style.cssText='position:fixed;bottom:0;left:0;right:0;padding:4px 12px;font-size:11px;font-weight:600;text-align:center;z-index:999;transition:background .3s;display:none';
    document.body.appendChild(bar);
  }
  if(!navigator.onLine){
    bar.style.display='block';
    bar.style.background='#a3201e';bar.style.color='#fff';
    bar.textContent='Offline — absensi disimpan sementara, akan dikirim saat online';
  } else {
    idbGetAll().then(items=>{
      if(items.length>0){
        bar.style.display='block';
        bar.style.background='#8a5a00';bar.style.color='#fff';
        bar.textContent='Menyinkronkan '+items.length+' data absen...';
      } else {
        bar.style.display='none';
      }
    }).catch(()=>{bar.style.display='none';});
  }
}
async function syncPending(){
  if(!navigator.onLine)return;
  let items=[];
  try{items=await idbGetAll();}catch(e){return;}
  if(!items.length){updateOnlineBar();return;}
  let synced=0;
  for(const item of items){
    try{
      const {id,...data}=item;
      const existing=await getDocs(query(collection(db,'absensi'),
        where('nama','==',data.nama),
        where('tanggal','==',data.tanggal),
        where('kelasId','==',data.kelasId)
      ));
      if(existing.empty){
        await addDoc(collection(db,'absensi'),{
          nama:data.nama,kelasId:data.kelasId,tanggal:data.tanggal,
          jamStr:data.jamStr,status:data.status,
          waktu:Timestamp.fromDate(new Date(data.waktuMs))
        });
      }
      await idbDelete(id);synced++;
    }catch(e){console.warn('Sync gagal item:',e);}
  }
  if(synced>0){
    const box=document.getElementById('alert-box');
    if(box)showAlert(box,synced+' data offline berhasil disinkronkan','ok');
  }
  updateOnlineBar();
}
window.addEventListener('online',()=>{updateOnlineBar();setTimeout(syncPending,1000);});
window.addEventListener('offline',()=>updateOnlineBar());

async function loadKelas(){
  const sel=document.getElementById('sel-kelas');

  // Bersihkan cache kosong dari sesi lama
  ['cache_kelas','adm_cache_kelas'].forEach(k=>{
    const v=localStorage.getItem(k);
    if(v){try{if(!JSON.parse(v).length)localStorage.removeItem(k);}catch(e){localStorage.removeItem(k);}}
  });

  // Load cache dulu agar langsung tampil walau offline
  const cached=localStorage.getItem('cache_kelas')||localStorage.getItem('adm_cache_kelas');
  if(cached){
    try{
      const c=JSON.parse(cached);
      if(c.length){
        kelasList=c;
        sel.innerHTML=kelasList.map(k=>'<option value="'+k.id+'">'+k.nama+'</option>').join('');
        selectedKelas=kelasList[0].id;sel.value=selectedKelas;
        gantiKelas();
      }
    }catch(e){}
  }

  // Coba fetch dari Firestore (dengan timeout 5 detik)
  try{
    const fetchPromise=getDocs(collection(db,'kelas'));
    const timeoutPromise=new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),5000));
    const snap=await Promise.race([fetchPromise,timeoutPromise]);
    const fresh=[];snap.forEach(d=>fresh.push({id:d.id,...d.data()}));
    if(fresh.length>0){
      kelasList=fresh;
      kelasList.sort((a,b)=>a.nama.localeCompare(b.nama));
      localStorage.setItem('cache_kelas',JSON.stringify(kelasList));
      sel.innerHTML=kelasList.map(k=>'<option value="'+k.id+'">'+k.nama+'</option>').join('');
      selectedKelas=kelasList[0].id;sel.value=selectedKelas;
      gantiKelas();
    }
  }catch(e){
    // Offline atau timeout - sudah pakai cache di atas
    if(!kelasList.length){
      sel.innerHTML='<option value="">Belum ada kelas — buat di admin</option>';
    }
  }
}

window.gantiKelas=function(){
  selectedKelas=document.getElementById('sel-kelas').value;
  const k=kelasList.find(x=>x.id===selectedKelas);
  document.getElementById('kelas-label').textContent=k?(k.nama.replace(/kelas/gi,'Grade')):'Absensi Harian';
  loadSiswa();subscribeAbsen();
};

async function loadSiswa(){
  if(!selectedKelas)return;

  // Load cache dulu
  const cached=localStorage.getItem('cache_siswa_'+selectedKelas);
  if(cached){try{siswaList=JSON.parse(cached);}catch(e){}}
  else{
    const all=localStorage.getItem('adm_cache_siswa');
    if(all){try{siswaList=JSON.parse(all).filter(s=>s.kelasId===selectedKelas);}catch(e){}}
  }
  updateCounter();

  // Update dari Firestore dengan timeout
  try{
    const fetchP=getDocs(query(collection(db,'siswa'),where('kelasId','==',selectedKelas)));
    const snap=await Promise.race([fetchP,new Promise((_,r)=>setTimeout(()=>r(new Error('t')),5000))]);
    const fresh=[];snap.forEach(d=>fresh.push({id:d.id,...d.data()}));
    if(fresh.length>0){
      siswaList=fresh;
      localStorage.setItem('cache_siswa_'+selectedKelas,JSON.stringify(siswaList));
      updateCounter();
    }
  }catch(e){}
}

function subscribeAbsen(){
  if(unsubscribe)unsubscribe();
  if(!selectedKelas)return;
  if(!navigator.onLine){
    // Offline: tampilkan data lokal saja, pending items sudah di absenHariIni
    renderLog();updateCounter();return;
  }
  try{
    const q=query(collection(db,'absensi'),where('tanggal','==',todayStr()),where('kelasId','==',selectedKelas));
    unsubscribe=onSnapshot(q,snap=>{
      absenHariIni={};
      snap.forEach(d=>{const dd=d.data();if(!absenHariIni[dd.nama])absenHariIni[dd.nama]={};absenHariIni[dd.nama][dd.jenis||'masuk']={...dd,id:d.id};});
      // Merge dengan data offline pending
      idbGetAll().then(pending=>{
        pending.forEach(p=>{if(!absenHariIni[p.nama])absenHariIni[p.nama]={...p,_pending:true};});
        renderLog();updateCounter();
      }).catch(()=>{renderLog();updateCounter();});
    },err=>{console.error('Firestore:',err);renderLog();updateCounter();});
  }catch(e){renderLog();updateCounter();}
}

function updateCounter(){
  const masuk=Object.values(absenHariIni).filter(a=>a.masuk).length;
  const pulang=Object.values(absenHariIni).filter(a=>a.pulang).length;
  document.getElementById('cnt-masuk').textContent=masuk;
  document.getElementById('cnt-pulang').textContent=pulang;
  document.getElementById('cnt-belum').textContent=Math.max(0,siswaList.length-masuk);
}

function renderLog(){
  const list=document.getElementById('log-list');
  const items=Object.entries(absenHariIni)
    .filter(([,a])=>a[absenMode])
    .map(([nama,a])=>({nama,rec:a[absenMode]}))
    .sort((a,b)=>(b.rec.waktu?.seconds||b.rec.waktuMs/1000||0)-(a.rec.waktu?.seconds||a.rec.waktuMs/1000||0));
  document.getElementById('log-count').textContent=`${items.length} siswa`;
  if(!items.length){list.innerHTML='<p style="color:var(--hint);font-size:13px;text-align:center;padding:12px">Belum ada yang absen</p>';return;}
  list.innerHTML=items.map(d=>{
    const badgeCls=d.status==='Hadir'?'b-hadir':d.status==='Terlambat'?'b-terlambat':'b-alfa';
    const pendingBadge=d._pending?'<span style="font-size:10px;color:var(--amber);margin-left:4px">⏳</span>':'';
    return '<div class="log-item"><div><div class="log-name">'+d.nama+pendingBadge+'</div><div class="log-time">'+d.jamStr+'</div></div><span class="badge '+badgeCls+'">'+d.status+'</span></div>';
  }).join('');
}

function playSound(ok){
  try{
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.connect(g);g.connect(ctx.destination);
    if(ok){o.frequency.setValueAtTime(880,ctx.currentTime);o.frequency.setValueAtTime(1200,ctx.currentTime+.1);}
    else{o.frequency.setValueAtTime(300,ctx.currentTime);o.frequency.setValueAtTime(180,ctx.currentTime+.15);}
    g.gain.setValueAtTime(.3,ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.35);
    o.start();o.stop(ctx.currentTime+.35);
  }catch(e){}
}

function flashScreen(ok){
  document.body.classList.remove('flash-ok','flash-err');
  void document.body.offsetWidth;
  document.body.classList.add(ok?'flash-ok':'flash-err');
  setTimeout(()=>document.body.classList.remove('flash-ok','flash-err'),500);
}

async function doAbsen(nama){
  const box=document.getElementById('alert-box');
  nama=nama.trim();
  if(!nama){showAlert(box,'Nama tidak boleh kosong','err');flashScreen(false);playSound(false);return;}
  if(!selectedKelas){showAlert(box,'Pilih kelas terlebih dahulu','err');return;}
  if(absenHariIni[nama]){showAlert(box,nama+' sudah absen pukul '+absenHariIni[nama].jamStr,'err');flashScreen(false);playSound(false);return;}
  const now=new Date();
  const tot=now.getHours()*60+now.getMinutes();
  let status;
  if(absenMode==='masuk'){status=tot<=(BATAS_H*60+BATAS_M)?'Hadir':'Terlambat';}
  else{status='Pulang';}
  const jamStr=pad(now.getHours())+':'+pad(now.getMinutes());
  const locData=getLocNote();
  const rec={nama,kelasId:selectedKelas,tanggal:todayStr(),jamStr,status,jenis:absenMode,
    lat:locData.lat,lng:locData.lng,jarak_meter:locData.jarak_meter,lokasi:locData.lokasi,waktuMs:now.getTime()};

  if(!navigator.onLine){
    // Simpan ke IndexedDB
    try{
      await idbSave(rec);
      if(!absenHariIni[nama])absenHariIni[nama]={};
      absenHariIni[nama][absenMode]={...rec,_pending:true};
      renderLog();updateCounter();
      // Simpan ke localStorage agar admin rekap bisa baca
      const lsKey='absen_local_'+todayStr();
      let localAbsen=[];try{localAbsen=JSON.parse(localStorage.getItem(lsKey)||'[]');}catch(e){}
      if(!localAbsen.find(x=>x.nama===nama))localAbsen.push(rec);
      localStorage.setItem(lsKey,JSON.stringify(localAbsen));
      showAlert(box,'[OFFLINE] '+nama+' dicatat — '+status+' pukul '+jamStr,'info');
      flashScreen(true);playSound(true);
      document.getElementById('inp-nama').value='';
      updateOnlineBar();
    }catch(e){
      showAlert(box,'Gagal simpan offline: '+e.message,'err');
      flashScreen(false);playSound(false);
    }
    return;
  }

  // Online: langsung ke Firestore
  try{
    await addDoc(collection(db,'absensi'),{nama,kelasId:selectedKelas,tanggal:todayStr(),jamStr,status,jenis:absenMode,lat:locData.lat,lng:locData.lng,jarak_meter:locData.jarak_meter,lokasi:locData.lokasi,waktu:Timestamp.fromDate(now)});
    showAlert(box,'✓ '+nama+' — '+status+' pukul '+jamStr,'ok');
    flashScreen(true);playSound(true);
    document.getElementById('inp-nama').value='';
  }catch(e){
    // Firestore gagal, fallback ke offline
    try{
      await idbSave(rec);
      if(!absenHariIni[nama])absenHariIni[nama]={};
      absenHariIni[nama][absenMode]={...rec};
      renderLog();updateCounter();
      showAlert(box,'[Tersimpan lokal] '+nama+' — '+status,'info');
      flashScreen(true);playSound(true);
      document.getElementById('inp-nama').value='';
      updateOnlineBar();
    }catch(e2){
      showAlert(box,'Gagal menyimpan: '+e.message,'err');
      flashScreen(false);playSound(false);
    }
  }
}

function showAlert(el,msg,type){
  el.textContent=msg;
  el.className='alert '+(type==='ok'?'a-ok':type==='info'?'a-info':'a-err');
  el.style.display='block';
  setTimeout(()=>el.style.display='none',3500);
}

window.absenManual=()=>doAbsen(document.getElementById('inp-nama').value);

window.startCam=async function(){
  const box=document.getElementById('alert-box');
  if(!navigator.mediaDevices?.getUserMedia){
    alert('Browser tidak mendukung kamera. Gunakan Chrome atau Edge terbaru.');return;
  }
  try{
    camStream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},audio:false
    });
    const v=document.getElementById('cam-video');
    v.srcObject=camStream;
    document.getElementById('scanner-wrap').style.display='block';
    await v.play();
    startScanLoop();
  }catch(e){
    if(e.name==='NotAllowedError'){
      alert('Izin kamera ditolak.\n\nKlik ikon gembok di address bar → Izinkan → Refresh halaman.');
    }else{
      alert('Error kamera: '+e.message);
    }
  }
};

window.stopCam=function(){
  if(scanInterval){clearInterval(scanInterval);scanInterval=null;}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  document.getElementById('scanner-wrap').style.display='none';
  document.getElementById('cam-video').srcObject=null;
};

function processQRResult(raw){
  let nama=raw.trim();
  if(nama.includes('|KELAS8|'))nama=nama.split('|KELAS8|')[1];
  else if(nama.startsWith('ABSEN|'))nama=nama.split('|').pop();
  doAbsen(nama);
}

async function startScanLoop(){
  const video=document.getElementById('cam-video');
  let lastResult='',lastTime=0;
  function shouldProcess(raw){
    const now=Date.now();
    if(raw===lastResult&&now-lastTime<4000)return false;
    lastResult=raw;lastTime=now;return true;
  }
  function canvasScan(){
    const canvas=document.getElementById('scan-canvas');
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    scanInterval=setInterval(()=>{
      if(!video.srcObject||video.paused||video.videoWidth===0)return;
      if(typeof window.jsQR!=='function')return;
      canvas.width=video.videoWidth;canvas.height=video.videoHeight;
      ctx.drawImage(video,0,0);
      const img=ctx.getImageData(0,0,canvas.width,canvas.height);
      const code=window.jsQR(img.data,img.width,img.height,{inversionAttempts:'attemptBoth'});
      if(code&&code.data&&shouldProcess(code.data))processQRResult(code.data);
    },200);
  }
  if('BarcodeDetector' in window){
    try{
      const detector=new BarcodeDetector({formats:['qr_code']});
      scanInterval=setInterval(async()=>{
        if(!video.srcObject||video.paused||video.videoWidth===0)return;
        try{
          const codes=await detector.detect(video);
          if(codes.length>0&&shouldProcess(codes[0].rawValue))processQRResult(codes[0].rawValue);
        }catch(e){}
      },200);
    }catch(e){ canvasScan(); }
  } else {
    canvasScan();
  }
}

openIDB().then(()=>{updateOnlineBar();syncPending();startLoc();});

window.hapusDataLokal=async function(){
  if(!navigator.onLine){
    alert('Hapus data lokal sebaiknya dilakukan saat online agar data Firestore tetap aman.');
    if(!confirm('Tetap hapus?'))return;
  } else {
    if(!confirm('Hapus semua data cache lokal?\nData absensi di Firestore tidak akan terhapus.'))return;
  }
  // Hapus semua key cache
  const keys=Object.keys(localStorage).filter(k=>
    k.startsWith('cache_')||k.startsWith('adm_cache_')||
    k.startsWith('absen_local_')||k==='admin_session'
  );
  keys.forEach(k=>localStorage.removeItem(k));
  // Hapus IndexedDB pending
  try{
    const pending=await idbGetAll();
    for(const item of pending)await idbDelete(item.id);
  }catch(e){}
  const box=document.getElementById('alert-box');
  showAlert(box,'Data lokal dihapus ('+keys.length+' item)','info');
  updateOnlineBar();
};

// Simpan semua data penting ke localStorage untuk mode offline
window.simpanDataOffline=async function(){
  const btn=document.getElementById('btn-save-offline');
  if(!navigator.onLine){
    alert('Tidak bisa simpan saat offline. Hubungkan internet dulu.');return;
  }
  btn.textContent='Menyimpan...';btn.disabled=true;
  try{
    // 1. Simpan semua kelas
    const kelasSnap=await getDocs(collection(db,'kelas'));
    const kelasFresh=[];kelasSnap.forEach(d=>kelasFresh.push({id:d.id,...d.data()}));
    kelasFresh.sort((a,b)=>a.nama.localeCompare(b.nama));
    localStorage.setItem('cache_kelas',JSON.stringify(kelasFresh));
    localStorage.setItem('adm_cache_kelas',JSON.stringify(kelasFresh));

    // 2. Simpan semua siswa
    const siswaSnap=await getDocs(collection(db,'siswa'));
    const siswaFresh=[];siswaSnap.forEach(d=>siswaFresh.push({id:d.id,...d.data()}));
    localStorage.setItem('adm_cache_siswa',JSON.stringify(siswaFresh));
    // Simpan per kelas juga
    kelasFresh.forEach(k=>{
      const filtered=siswaFresh.filter(s=>s.kelasId===k.id);
      localStorage.setItem('cache_siswa_'+k.id,JSON.stringify(filtered));
    });

    // 3. Simpan absensi hari ini
    const today=todayStr();
    const absenSnap=await getDocs(query(collection(db,'absensi'),where('tanggal','==',today)));
    const absenFresh=[];absenSnap.forEach(d=>absenFresh.push({id:d.id,...d.data()}));
    localStorage.setItem('adm_cache_absen_'+today,JSON.stringify(absenFresh));

    // 4. Simpan izin
    const izinSnap=await getDocs(collection(db,'izin'));
    const izinFresh=[];izinSnap.forEach(d=>izinFresh.push({id:d.id,...d.data()}));
    localStorage.setItem('adm_cache_izin',JSON.stringify(izinFresh));
    localStorage.setItem('adm_cache_izin_full',JSON.stringify(izinFresh));

    const total=kelasFresh.length+' kelas, '+siswaFresh.length+' siswa, '+absenFresh.length+' absen hari ini, '+izinFresh.length+' izin';
    btn.textContent='✓ Tersimpan!';btn.style.background='var(--green)';btn.style.color='#fff';
    setTimeout(()=>{btn.textContent='💾 Simpan Data untuk Offline';btn.style.background='';btn.style.color='';btn.disabled=false;},3000);
    const box=document.getElementById('alert-box');
    showAlert(box,'Data offline tersimpan: '+total,'ok');

    // Reload kelas agar dropdown terupdate
    kelasList=kelasFresh;
    const sel=document.getElementById('sel-kelas');
    sel.innerHTML=kelasList.map(k=>'<option value="'+k.id+'">'+k.nama+'</option>').join('');
    if(kelasList.length){selectedKelas=kelasList[0].id;sel.value=selectedKelas;gantiKelas();}
  }catch(e){
    btn.textContent='Gagal - coba lagi';btn.disabled=false;
    console.error(e);
  }
};

// Unduh cache absensi hari ini sebagai JSON
window.unduhCache=async function(){
  const today=todayStr();
  // Gabungkan data Firestore (absenHariIni) + pending IndexedDB
  const fireData=Object.values(absenHariIni).map(d=>({
    nama:d.nama,kelas:d.kelasId||selectedKelas,
    tanggal:d.tanggal||today,jam:d.jamStr,status:d.status,
    sumber:d._pending?'pending_offline':'firestore'
  }));
  let pendingData=[];
  try{
    const all=await idbGetAll();
    pendingData=all.filter(d=>d.tanggal===today).map(d=>({
      nama:d.nama,kelas:d.kelasId,tanggal:d.tanggal,
      jam:d.jamStr,status:d.status,sumber:'offline_belum_sync'
    }));
  }catch(e){}
  // Merge, hindari duplikat
  const seen=new Set(fireData.map(d=>d.nama));
  const merged=[...fireData,...pendingData.filter(d=>!seen.has(d.nama))];
  if(!merged.length){alert('Belum ada data absen hari ini');return;}
  const json=JSON.stringify({tanggal:today,total:merged.length,data:merged},null,2);
  const blob=new Blob([json],{type:'application/json'});
  const a=document.createElement('a');
  a.download='absen-'+today+'.json';
  a.href=URL.createObjectURL(blob);
  a.click();
  URL.revokeObjectURL(a.href);
};
