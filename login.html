<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Absensi Kelas 8</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f5f4f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1rem}
  .card{background:#fff;border:1px solid #e2e0d8;border-radius:16px;padding:2rem;width:100%}
  .logo{text-align:center;margin-bottom:1.5rem}
  .logo-icon{width:52px;height:52px;background:#1a1917;border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:22px}
  h1{font-size:20px;font-weight:700;color:#1a1917;text-align:center}
  p{font-size:13px;color:#6b6963;text-align:center;margin-top:4px}
  label{font-size:12px;font-weight:600;color:#6b6963;display:block;margin-bottom:4px;margin-top:14px}
  input{width:100%;padding:9px 12px;border:1px solid #e2e0d8;border-radius:10px;font-size:14px;font-family:'Plus Jakarta Sans',sans-serif;color:#1a1917;background:#fff;outline:none;transition:border .15s}
  input:focus{border-color:#1a1917}
  .btn{width:100%;padding:10px;background:#1a1917;color:#fff;border:none;border-radius:10px;font-size:14px;font-weight:600;font-family:'Plus Jakarta Sans',sans-serif;cursor:pointer;margin-top:18px;transition:opacity .15s}
  .btn:hover{opacity:0.85}
  .err{background:#fce8e8;color:#a3201e;border:1px solid #f4a9a8;border-radius:8px;padding:9px 12px;font-size:13px;margin-top:12px;display:none}
  .back{text-align:center;margin-top:14px;font-size:13px;color:#6b6963}
  .back a{color:#1a1917;font-weight:600;text-decoration:none}
.logo-bar{display:flex;align-items:center;gap:10px;padding:.625rem 0;margin-bottom:1rem;border-bottom:2px solid var(--border, #e2e0d8)}
.logo-img{width:50px;height:50px;object-fit:contain;flex-shrink:0}
.logo-center-text{flex:1;text-align:center}
.logo-school-name{display:block;font-size:13px;font-weight:700}
.logo-school-sub{display:block;font-size:10px;margin-top:1px;opacity:.7}
.wm-bar{display:flex;align-items:center;justify-content:center;padding:8px 0;margin-top:1.25rem;border-top:1px solid var(--border, #e2e0d8)}
.wm-text{font-size:10px;font-weight:600;letter-spacing:.5px;opacity:.55}

</style>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/absen-kelas8/sw.js')
      .then(r=>console.log('SW registered'))
      .catch(e=>console.warn('SW failed:',e));
  });
}
</script>
</head>
<body>
<div style="width:100%;max-width:400px">
<div class="logo-bar">
  <!-- Logo Yayasan LIS -->
<img src="yayasan-lis.png" alt="Yayasan LIS" class="logo-img">  <div class="logo-center-text">
    <span class="logo-school-name">SMP Sains Lombok Islamic School</span>
    <span class="logo-school-sub">Portal Admin</span>
  </div>
  <!-- Logo SMP Sains LIS -->
<img src="smp-sains-lis.png" alt="SMP Sains LIS" class="logo-img"></div>
<div class="card">
  <div class="logo">
    <img src="smp-sains-lis.png" alt="SMP Sains LIS" style="width:64px;height:64px;border-radius:50%;object-fit:contain;background:#fff;border:3px solid #e8e8e8;box-shadow:0 3px 10px rgba(0,0,0,.15);margin-bottom:.5rem" onerror="this.style.opacity='.3'">
    <h1>Admin Login</h1>
    <p>Masuk untuk kelola absensi kelas 8</p>
  </div>
  <label>Email</label>
  <input type="email" id="email" placeholder="admin@sekolah.com">
  <label>Password</label>
  <input type="password" id="pass" placeholder="••••••••" onkeydown="if(event.key==='Enter')login()">
  <div class="err" id="err"></div>
  <button class="btn" onclick="login()" id="btn-login">Masuk</button>
  <div class="back"><a href="index.html">← Kembali ke halaman scan</a></div>
</div>
<div class="wm-bar"><span class="wm-text">By-Kali-Linux-Arya. | SMP Sains Lombok Islamic School | v2.0</span></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDlCnUvgyDT-oTfJJ-nxcPWkhpY_b6JeBw",
  authDomain: "absen-kelas8.firebaseapp.com",
  projectId: "absen-kelas8",
  storageBucket: "absen-kelas8.firebasestorage.app",
  messagingSenderId: "636560501063",
  appId: "1:636560501063:web:4384206e2a3cd94151c462"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Auto-login jika sesi cache tersedia dan cocok
(function(){
  const saved=localStorage.getItem('admin_session');
  if(saved){
    try{
      const s=JSON.parse(saved);
      if(s.email)document.getElementById('email').value=s.email;
    }catch(e){}
  }
})();

window.login = async function() {
  const email = document.getElementById('email').value.trim();
  const pass = document.getElementById('pass').value;
  const err = document.getElementById('err');
  const btn = document.getElementById('btn-login');
  if(!email||!pass){err.textContent='Email dan password wajib diisi';err.style.display='block';return;}
  btn.textContent='Memuat...';btn.disabled=true;
  err.style.display='none';

  // Coba Firebase login dulu
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    localStorage.setItem('admin_session',JSON.stringify({email,pass}));
    window.location.href='admin.html';
    return;
  } catch(e) {
    // Kalau error jaringan/unavailable, coba kredensial cache
    if(e.code==='auth/network-request-failed'||e.code==='unavailable'||
       e.message.includes('network')||e.message.includes('offline')||
       e.message.includes('unavailable')){
      const saved=localStorage.getItem('admin_session');
      if(saved){
        try{
          const s=JSON.parse(saved);
          if(s.email===email&&s.pass===pass){
            window.location.href='admin.html';return;
          }
        }catch(ex){}
      }
      err.textContent='Tidak bisa konek ke server. Pastikan pernah login online sebelumnya.';
    } else if(e.code==='auth/user-not-found'||e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'){
      err.textContent='Email atau password salah.';
    } else if(e.code==='auth/too-many-requests'){
      err.textContent='Terlalu banyak percobaan. Coba lagi nanti.';
    } else {
      // Fallback: cek cache dulu sebelum menyerah
      const saved=localStorage.getItem('admin_session');
      if(saved){
        try{
          const s=JSON.parse(saved);
          if(s.email===email&&s.pass===pass){
            window.location.href='admin.html';return;
          }
        }catch(ex){}
      }
      err.textContent='Login gagal: '+e.message;
    }
    err.style.display='block';
    btn.textContent='Masuk';btn.disabled=false;
  }
};
</script>
</body>
</html>
